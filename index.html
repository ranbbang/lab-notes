<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보관함</title>
<meta name="robots" content="noindex,nofollow">
<style id="lockStyle">
  :root { color-scheme: dark; }
  /* body 에는 잠금 화면이 뜨기 전부터 필요하고 언락 뒤에도 해가 없는 것만
     둔다 — 배경·글자색·글꼴·margin. 앱 자신의 style.css 가 body 에 이
     넷을 전부 다시 선언하므로 주입 뒤에는 그 값으로 완전히 덮인다
     (publish/tests/test_shell_layout.py 세 번째 검사가 이걸 지킨다).
     레이아웃(중앙 정렬)은 잠금 화면 자신의 것이지 body 의 것이 아니다 —
     예전엔 이 규칙이 body 에 있어서 언락 뒤에도 살아남아 앱의 header.top·
     .wrap 을 나란한 flex 항목으로 만들었다. 이제 #lock 에 둔다. */
  body { margin:0; background:#0f1116; color:#dedede;
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  #lock { min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .box { width:min(340px,86vw); text-align:center; }
  h1 { font-size:15px; font-weight:600; margin:0 0 4px; }
  p.sub { font-size:12px; opacity:.55; margin:0 0 18px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:8px;
          border:1px solid #3a3a3c; background:#1a1b20; color:#dedede; font-size:14px; }
  button { margin-top:10px; width:100%; padding:10px; border-radius:8px;
           border:1px solid #3a3a3c; background:#232324; color:#dedede;
           font-size:13px; cursor:pointer; }
  button[disabled] { opacity:.5; cursor:default; }
  .err { margin-top:10px; font-size:12px; color:#ff8080; min-height:1em; }
</style>
</head>
<body>
<div id="lock">
  <div class="box">
    <h1>보관함</h1>
    <p class="sub">암구호를 입력하세요.</p>
    <form id="f">
      <input id="pw" type="password" autocomplete="current-password"
             autocapitalize="off" spellcheck="false" aria-label="암구호">
      <button type="submit" id="go">열기</button>
    </form>
    <div class="err" id="err" role="status"></div>
  </div>
</div>

<script>
'use strict';
/* 부팅 실패 안전망 — src/shell.html 의 __showBootError 와 같은 목적이다.
   잠금 화면을 스크립트 주입보다 먼저 지우므로, 번들이 최상단에서 던지면
   잠금 화면은 이미 없고 앱은 안 그려져 아무 메시지 없는 빈 화면이 남는다.
   아래 try/catch 는 이걸 못 잡는다 — 주입한 <script> 의 예외는 catch 로
   오지 않고 window 의 error 이벤트로만 온다. 그래서 주입 '전에' 여기서
   등록해 둔다(최상단에 두는 이유도 같다 — 그 전에 나는 예외도 잡는다).

   '아직 안 그려졌다' 는 body 에 SCRIPT 말고 다른 요소가 있는지로 본다.
   앱이 그린 뒤에 나는 오류는 콘솔에만 남기고 화면은 그대로 둔다 —
   보고 있던 화면을 함부로 덮으면 오히려 더 나쁘다. */
function bodyBlank() {
  var kids = document.body ? document.body.children : [];
  for (var i = 0; i < kids.length; i++) {
    if (kids[i].tagName !== 'SCRIPT') return false;
  }
  return true;
}
function showBootError(msg) {
  if (!document.body || !bodyBlank()) return;
  // 완전히 인라인 스타일로만 그린다 — #lockStyle 이 이미 지워져 있을 수
  // 있어서다(unlock() 이 잠금 화면을 지우면서 그 스타일도 같이 지운다).
  // .box·button 같은 외부 클래스에 기대면 이 안전망이 스스로도 못 그린다.
  document.body.innerHTML =
    '<div style="min-height:100vh;display:flex;align-items:center;' +
    'justify-content:center;box-sizing:border-box;padding:0 20px">' +
    '<div style="width:min(340px,86vw);text-align:center">' +
    '<div style="font-size:15px;margin-bottom:8px">불러오는 중 오류가 발생했습니다</div>' +
    '<div style="font-size:12.5px;opacity:.75;margin-bottom:14px;line-height:1.5">' +
    msg + '</div>' +
    '<button type="button" onclick="location.reload()" style="margin-top:10px;' +
    'width:100%;padding:10px;border-radius:8px;border:1px solid #3a3a3c;' +
    'background:#232324;color:#dedede;font-size:13px;cursor:pointer">새로고침</button>' +
    '</div></div>';
}
window.addEventListener('error', function (e) {
  showBootError('스크립트 오류: ' + (e && e.message ? e.message : '알 수 없는 오류'));
});
window.addEventListener('unhandledrejection', function () {
  showBootError('처리되지 않은 오류가 발생했습니다.');
});

// 복호화 본문은 publish/decrypt_check.js 의 unlock() 과 같다. 한쪽만 고치면
// 노드 대조가 무의미해진다 — 둘을 같이 고친다.
async function unlock(blob, passphrase) {
  const dec = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const km = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(passphrase), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: dec(blob.salt), iterations: blob.iter, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: dec(blob.iv) }, key, dec(blob.ct));
  return new TextDecoder().decode(pt);
}

// 종가 CSV 는 암호문 밖에 있다 — 잠금 해제를 기다리지 않고 미리 받아 둔다.
// 10-backtest.js:5 가 모듈 최상단에서 BARS 를 읽으므로 앱이 돌기 전에 있어야 한다.
function parseCsv(text) {
  const out = [];
  for (const line of text.split('\n').slice(1)) {
    const p = line.trim().split(',');
    if (p.length < 2 || !p[0] || !p[1]) continue;
    const close = parseFloat(p[1]);
    if (!(close > 0)) continue;
    out.push({
      date: new Date(+p[0].slice(0, 4), +p[0].slice(5, 7) - 1, +p[0].slice(8, 10)),
      close: close, raw: p[1], ymd: p[0]
    });
  }
  return out;
}
const bars = (async () => {
  const get = (u) => fetch(u, { cache: 'no-store' })
    .then((r) => (r.ok ? r.text() : '')).catch(() => '');
  const [a, b] = await Promise.all([get('data/series-a.csv'), get('data/series-b.csv')]);
  return { a: parseCsv(a), b: parseCsv(b) };
})();

const $ = (id) => document.getElementById(id);
$('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pw = $('pw').value;
  if (!pw) return;
  $('go').disabled = true;
  $('go').textContent = '여는 중…';
  $('err').textContent = '';
  try {
    const blob = JSON.parse($('blob').textContent);
    const bundle = JSON.parse(await unlock(blob, pw));
    const data = await bars;
    if (!data.a.length) throw new Error('종가 데이터를 받지 못했습니다');

    // 앱 IIFE 가 돌기 전에 전역을 놓는다.
    window.BARS = data.a;
    window.BARS_ALT = data.b;
    window.DATA_ASOF = data.a[data.a.length - 1].ymd;
    window.DSP_PUBLIC = true;

    $('lock').remove();
    // 두 번째 방어선 — 스코프를 옮겨도(#lock 규칙) 잠금 스타일 자체가 남아
    // 있으면 h1·input·button 같은 맨 태그 선택자가 앱의 같은 태그를 계속
    // 건드릴 수 있다. 잠금 화면을 지우는 시점에 이 <style> 도 통째로 지워
    // 아무것도 남지 않게 한다.
    const lockStyle = $('lockStyle');
    if (lockStyle) lockStyle.remove();
    const st = document.createElement('style');
    st.textContent = bundle.css;
    document.head.appendChild(st);
    const sc = document.createElement('script');
    sc.textContent = bundle.js;
    document.body.appendChild(sc);
    // 주입한 스크립트는 동기로 돈다(dspt-shim 의 boot 가 콜백을 바로 부른다).
    // 그 뒤에도 화면이 비어 있으면 앱이 예외 없이 조용히 실패한 것이다.
    // 정상이면 bodyBlank() 가 거짓이라 아무 일도 안 한다.
    setTimeout(function () { showBootError('앱이 화면을 그리지 못했습니다.'); }, 0);
  } catch (err) {
    // GCM 태그 검증 실패가 대부분이다 — 암구호가 틀렸다는 뜻이다.
    $('err').textContent = '암구호가 맞지 않습니다.';
    $('go').disabled = false;
    $('go').textContent = '열기';
    $('pw').select();
  }
});
$('pw').focus();
</script>
