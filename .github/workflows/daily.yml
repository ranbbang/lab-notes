name: 종가 갱신

on:
  # 미 동부 장 마감(16:00 ET)은 서머타임이면 20:00 UTC, 표준시면 21:00 UTC 다.
  #
  # GitHub 스케줄은 제시각에 안 돈다. 22:30 UTC 로 걸어 둔 크론이 실제로는
  # 매번 2시간쯤 늦게(00:37~00:55 UTC, 한국 09:40 전후) 돌았다. 그래서 한 번에
  # 기대지 않고 세 번 건다 — 새 봉이 없으면 커밋을 안 하므로 여러 번 돌아도 같다.
  #   20:47 UTC (월~금) : 서머타임이면 마감 47분 뒤. 표준시면 아직 미확정이라
  #                       update_csv.py 가 그 봉을 버리고 다음 차례가 받는다.
  #   22:17 UTC (월~금) : 두 시기 모두 마감 뒤.
  #   01:07 UTC (화~토) : 앞의 둘이 늦거나 소스가 막혔을 때의 재시도.
  #                       UTC 로는 다음 날이라 요일이 2-6 이다.
  # 정각·30분은 GitHub 이 몰려 더 늦으므로 어중간한 분을 쓴다.
  schedule:
    - cron: '47 20 * * 1-5'
    - cron: '17 22 * * 1-5'
    - cron: '7 1 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write

# 두 차례가 겹쳐 돌면 둘 다 커밋하려다 뒤엣것의 push 가 거절된다. 줄을 세운다.
concurrency:
  group: daily-csv
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 세 소스가 다 막혀도 종료코드 0 이다 — 그날치가 안 쌓일 뿐이다.
      - name: 종가 받아 이어붙이기
        run: python tools/update_csv.py

      - name: 바뀐 것이 있으면 커밋
        run: |
          if git diff --quiet data/series-a.csv; then
            echo "새 종가 없음 — 커밋 생략"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/series-a.csv
          git commit -m "데이터: 종가 갱신"
          # 그사이 로컬 배포가 올라왔을 수 있다. 그 위에 얹어서 올린다.
          git pull --rebase
          git push

      # 세 소스가 다 막히면 커밋이 안 생긴다(의도된 동작이다). 그런데 공개
      # 저장소의 스케줄 워크플로는 60일 무활동이면 GitHub 이 끄므로, 오래
      # 막히면 커밋 0건 → 크론 비활성화 → 영구 정지인데 워크플로는 내내
      # 초록불이다. 여기서 빨간불을 켜 실패 알림이 가게 한다.
      - name: 데이터가 너무 낡았는지 확인
        run: python tools/update_csv.py --check-stale

# 손으로 돌리려면: gh workflow run daily.yml --repo ranbbang/lab-notes
# 미 장중에 손으로 돌려도 안전하다 — update_csv.py 가 미확정 봉(장이 안 끝난
# 날의 캔들 = 현재가)을 버린다.
